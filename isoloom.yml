# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-054-24 Auth 007 (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a PHP page of the Springfield Nuclear Power Plant protected by an HTTP login prompt.
# The benchmark folder benchmarks/XBEN-054-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-054-auth-007

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.97.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the Auth 007 page answers
    http: http://web:80/
    expect: 401
    wait: 180
  - name: the admin page asks for HTTP Basic credentials
    script: checks/probe.sh
    wait: 60

message: |
  Auth 007 answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The admin area asks for a login. Is every kind of request held to it?
